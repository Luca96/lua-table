name: test

on:
  push:
  pull_request:

jobs:
  busted:
    name: busted (Lua ${{ matrix.lua }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lua: ["5.1", "5.2", "5.3", "5.4", "luajit-2.1"]

    steps:
      - uses: actions/checkout@v5

      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: ${{ matrix.lua }}

      # LuaRocks < 3.12 can't load the luarocks.org manifest on LuaJIT; v6 installs 3.13
      - uses: leafo/gh-actions-luarocks@v6

      - name: Install busted
        run: luarocks install busted

      - name: Run the test suite
        run: |
          lua -v
          busted --exclude-tags=knownbug
